# Vale config for these docs, from the doc skill (init_project.py). Project rules go in .vale/styles/Lila.
StylesPath = .vale/styles
Vocab = Lila
MinAlertLevel = suggestion
Packages = Google, write-good, proselint

[*.md]
BasedOnStyles = Vale, Google, write-good, proselint, Docs, Lila

# Technical docs: product names, code, British or American spelling are all the project's call.
Vale.Spelling = NO
Google.Spelling = NO
Google.Acronyms = NO
Google.Parens = NO
Google.Semicolons = NO
Google.OxfordComma = NO
Google.Colons = NO
Google.Quotes = NO
Google.Ellipses = NO
Google.Contractions = NO
Google.WordListCase = NO
# Flags proper nouns; the project's style can bring it back with exceptions.
Google.Headings = NO
proselint.Typography = NO
write-good.E-Prime = NO
# Google.Passive already covers it.
write-good.Passive = NO
write-good.Weasel = suggestion
# Flags plain words like 'modify' and 'it is'; Docs.Filler covers the real wordiness.
write-good.TooWordy = NO
# Domain words ('decimate') and code-like tokens ('s.X') trip these constantly in technical docs.
proselint.Skunked = NO
proselint.Spelling = NO
Google.Spacing = NO
Google.Latin = warning
# Date order is the project's call (27 October 2026 or October 27, 2026).
Google.DateFormat = NO
# Troubleshooting symptoms are written in the reader's voice ('My mesh is black').
Google.FirstPerson = suggestion
# Duplicates of Docs.Filler.
write-good.So = NO

# The page template is instructions to the writer.
[**/template.md]
Docs.SelfReference = NO
